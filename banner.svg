<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Kaapi Kadai: filter coffee and tumblers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1410"/>
      <stop offset="0.55" stop-color="#4a2a14"/>
      <stop offset="1" stop-color="#b8662a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949c"/>
      <stop offset="0.22" stop-color="#f4f6f8"/>
      <stop offset="0.5" stop-color="#c3c8ce"/>
      <stop offset="0.8" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#50565d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9bfc6"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8b9199"/>
    </linearGradient>
    <radialGradient id="coffee" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#a0602e"/>
      <stop offset="1" stop-color="#3a1f0e"/>
    </radialGradient>
    <radialGradient id="bean" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9a5a2b"/>
      <stop offset="1" stop-color="#2e170a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- soft glow behind the tumbler -->
  <circle cx="985" cy="170" r="150" fill="#f6b26b" opacity="0.16" filter="url(#shadow)"/>

  <!-- title block -->
  <text x="60" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#f6f1ea">Kaapi Kadai</text>
  <text x="62" y="190" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f3d9bd">Filter coffee &amp; tumblers, Chennai</text>
  <text x="62" y="236" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2" fill="#e9b988">NEXT.JS  ·  SUPABASE  ·  VERCEL</text>

  <!-- coffee beans -->
  <g transform="translate(790 78) rotate(-24)">
    <ellipse rx="26" ry="17" fill="url(#bean)"/>
    <path d="M-24 0 C-10 -9 10 9 24 0" fill="none" stroke="#1b1410" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-8" cy="-8" rx="9" ry="4" fill="#fff" opacity="0.18"/>
  </g>
  <g transform="translate(1130 90) rotate(32)">
    <ellipse rx="22" ry="14" fill="url(#bean)"/>
    <path d="M-20 0 C-8 -8 8 8 20 0" fill="none" stroke="#1b1410" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="-7" cy="-6" rx="8" ry="3.5" fill="#fff" opacity="0.18"/>
  </g>
  <g transform="translate(1120 252) rotate(-12)">
    <ellipse rx="25" ry="16" fill="url(#bean)"/>
    <path d="M-23 0 C-10 -9 10 9 23 0" fill="none" stroke="#1b1410" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-8" cy="-7" rx="9" ry="4" fill="#fff" opacity="0.18"/>
  </g>
  <g transform="translate(850 262) rotate(40)">
    <ellipse rx="20" ry="13" fill="url(#bean)"/>
    <path d="M-18 0 C-8 -7 8 7 18 0" fill="none" stroke="#1b1410" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="985" cy="276" rx="150" ry="16" fill="#000" opacity="0.5" filter="url(#shadow)"/>

  <!-- saucer (davara base) -->
  <ellipse cx="985" cy="262" rx="130" ry="24" fill="#4a5056"/>
  <ellipse cx="985" cy="257" rx="130" ry="24" fill="url(#steel)"/>
  <ellipse cx="985" cy="254" rx="96" ry="14" fill="#2f3438" opacity="0.55"/>

  <!-- tumbler body -->
  <path d="M915 140 L935 248 A50 11 0 0 0 1035 248 L1055 140 Z" fill="url(#steel)"/>
  <path d="M935 248 A50 11 0 0 0 1035 248" fill="none" stroke="#3b4046" stroke-width="2" opacity="0.6"/>
  <!-- highlight streak -->
  <path d="M938 150 L952 240" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <!-- rim and coffee surface -->
  <ellipse cx="985" cy="140" rx="70" ry="15" fill="url(#rim)"/>
  <ellipse cx="985" cy="142" rx="60" ry="10" fill="url(#coffee)"/>
  <ellipse cx="968" cy="139" rx="22" ry="3.5" fill="#fff" opacity="0.18"/>

  <!-- steam -->
  <g fill="none" stroke="#fbe9d2" stroke-linecap="round" filter="url(#soft)">
    <path d="M958 118 C938 96 984 82 962 54" stroke-width="7" opacity="0.5"/>
    <path d="M988 112 C968 88 1014 72 992 40" stroke-width="8" opacity="0.55"/>
    <path d="M1016 118 C998 98 1038 86 1020 60" stroke-width="6" opacity="0.45"/>
  </g>
</svg>
